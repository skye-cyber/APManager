[project.scripts]
apmanager-tui = "app:main"

[project]
name = "apmanager-tui"
version = "0.1.0"
description = "Textual terminal interface for APManager"
requires-python = ">=3.10"
dependencies = ["textual>=0.50,<2"]

[tool.setuptools]
py-modules = ["app", "adapters", "auth", "config_store", "models"]

[tool.setuptools.packages.find]
where = ["."]
include = ["screens*", "themes*"]
